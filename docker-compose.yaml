services:
  fastapi:
    container_name: ai-fastapi
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    # entrypoint: ["/bin/bash", "/code/scripts/sleep-entrypoint.sh"]
    restart: always
    ports:
      - 8000:8000
    volumes:
      - .:/code:rw
      - ./logs:/code/logs:rw
    env_file:
      - .env
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: 12
      #     memory: 4G
    logging:
      driver: "journald"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3